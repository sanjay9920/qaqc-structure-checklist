<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2457d6">
    <title>Offline - Quality SIMS</title>
    <style>
      :root {
        color-scheme: light;
        --blue: #2457d6;
        --ink: #172033;
        --muted: #637083;
        --line: #dfe5ee;
        --panel: #ffffff;
        --page: #f5f7fb;
      }

      * {
        box-sizing: border-box;
        letter-spacing: 0;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: var(--page);
        color: var(--ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100% - 2rem, 420px);
        padding: 1.25rem;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 12px 30px rgba(23, 32, 51, 0.08);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.35rem;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      button {
        width: 100%;
        margin-top: 1rem;
        min-height: 46px;
        border: 0;
        border-radius: 8px;
        background: var(--blue);
        color: #ffffff;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Quality SIMS is offline</h1>
      <p>Checklist status update karne ke liye internet connection chahiye. Network wapas aane par page reload karein.</p>
      <button type="button" onclick="window.location.reload()">Reload</button>
    </main>
  </body>
</html>

{% extends "base.html" %}

{% block title %}Login - Quality Department{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-panel">
    <div class="mb-4">
      <p class="eyebrow mb-2">Quality Department</p>
      <h1 class="h3 mb-2">Structure inspection login</h1>
      <p class="text-muted mb-0">Manage structure quality checks, punch points and commissioning readiness.</p>
    </div>

    <div id="authAlert" class="alert d-none" role="alert"></div>

    <form id="loginForm" class="vstack gap-3">
      <div>
        <label for="loginEmail" class="form-label">Email</label>
        <input id="loginEmail" name="email" type="email" class="form-control form-control-lg" autocomplete="email" required>
      </div>
      <div>
        <label for="loginPassword" class="form-label">Password</label>
        <input id="loginPassword" name="password" type="password" class="form-control form-control-lg" autocomplete="current-password" required>
      </div>
      <button id="loginButton" class="btn btn-primary btn-lg w-100" type="submit">
        <i class="bi bi-shield-lock" aria-hidden="true"></i>
        Sign in
      </button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  window.nextUrl = {{ next_url | tojson }};
</script>
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
